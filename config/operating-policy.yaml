version: 2
stage: prepare_only

allowed_sources:
  - manual_job_description
  - manual_job_url
  - linkedin_job_alert_email
  - greenhouse_public_job_api
  - lever_public_postings_api

prohibited_actions:
  - scrape_linkedin
  - automate_linkedin_interactions
  - bypass_captcha
  - bypass_access_controls
  - accept_terms_automatically
  - invent_candidate_information
  - submit_applications

always_require_review:
  - legal_attestations
  - demographic_questions
  - candidate_work_authorization_ambiguity
  - compensation_questions
  - relocation_commitments
  - custom_essays
  - account_creation

job_decision_rules:
  sponsorship:
    when_required_by_profile:
      employer_offers_sponsorship: allow
      employer_sponsorship_unknown: allow
      employer_does_not_offer_sponsorship: deny
    when_not_required_by_profile:
      any_employer_sponsorship_status: allow

  compensation:
    at_or_above_profile_minimum: allow
    below_profile_minimum: review
    compensation_not_listed: allow

  role_relevance:
    target_or_semantically_related_work: allow
    different_title_alone: allow
    unrelated_work: deny

  location:
    preferred_location: allow
    remote_compatible: allow
    relocation_compatible: allow
    incompatible_location: deny

  ranking:
    preference_source: candidate_profile
    prioritize_target_role_family: true
    apply_profile_preferences_as_score_adjustments: true
    profile_hard_constraints_may_deny: true
    title_mismatch_alone_may_deny: false

decision_aggregation:
  deny_if_any_rule_denies: true
  review_if_no_deny_and_any_rule_reviews: true
  allow_if_all_applicable_rules_allow: true

truthfulness:
  verified_evidence_required: true
  unsupported_requirements_become_gaps: true
  generated_claims_require_validation: true

limits:
  max_jobs_per_run: null
  max_model_cost_per_run_usd: null
